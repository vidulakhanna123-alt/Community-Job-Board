name: Update jobs
on:
  schedule: [{cron: "30 2 * * *"}]   # 08:00 India time, every day
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests feedparser pyyaml
      - run: python fetch_jobs.py
      - run: |
          git config user.name "job-bot"
          git config user.email "job-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || (git commit -m "Update jobs" && git push)
